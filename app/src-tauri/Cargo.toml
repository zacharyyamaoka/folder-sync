[package]
name = "folder-sync-desktop"
version = "0.1.0"
description = "folder-sync desktop: sign in, and your folder is just there (docs/peps/0006)"
edition = "2021"
rust-version = "1.88"
publish = false

# WHY exact pins, all released at least two weeks before 2026-10-27 (Zach's rule for new dependencies): tauri 2.11.5
# (2026-07-01) and its plugins are the set kandev already builds on this machine; keyring 3.6.3 (2025-07-27) is the
# stock OS-keychain crate (Secret Service on Linux, Keychain on macOS, Credential Manager on Windows).
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.2"
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WHY: local HH:MM:SS for the menu and the log on every OS (was the `date` command); already in Tauri's tree
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
