# folder-sync's accounts Worker (PEP 0003): one account across Zach's apps. Better Auth (Google; the device grant for
# `folder-sync login`) on D1, short-lived R2 keys per person, each person's folders online, a web host per folder.
# Apps mount it at /fs/ on their own domain through a service binding (§3.2); it also answers on its own host.
# Deploying is Zach's call (never from an agent):
#   npx --prefix accounts wrangler d1 migrations apply DB --remote --config accounts/wrangler.toml
#   npx --prefix accounts wrangler deploy --config accounts/wrangler.toml
# One deployment per app (docs/NEW-APP.md): everything above and below is the top-level deployment, vibetracks.dev's. Every
# other app is one [env.<app>] block at the end of this file; `--env <app>` selects it.
name = "folder-sync-accounts"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# WHY nodejs_compat: Better Auth keeps its request context in AsyncLocalStorage
compatibility_flags = ["nodejs_compat"]

# For now the Worker's own host is its workers.dev address (PUBLIC_URL below); a custom domain can replace it later.
workers_dev = true
preview_urls = false

[assets]
# The sign-in and device pages' own script and style, served at /fs/site/<name> by the Worker (never directly)
directory = "./site"
binding = "ASSETS"
run_worker_first = true

# Users, sessions (each machine's device grant), pending device codes, and folder-sync's folder / folder_reader /
# web_host rows. Create it once (wrangler d1 create folder-sync-accounts) and put its id here.
[[d1_databases]]
binding = "DB"
database_name = "folder-sync-accounts"
database_id = "822b87c5-668f-4621-8da0-bdda116e8f33"
migrations_dir = "migrations"

# No R2 binding (§3.1): the Worker reads and writes each person's files through a temporary credential it signs for
# exactly one prefix per request, with the parent key below.

# The one R2 binding: the desktop installers (src/download.ts, PEP 0006), served publicly at /fs/download. Its own
# bucket, never the sync bucket: CI's upload token is scoped to this bucket only (R2 tokens cannot be scoped to a prefix).
# Create it once before the deploy that adds this: npx --prefix accounts wrangler r2 bucket create folder-sync-downloads
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "folder-sync-downloads"

# One web-host writer per folder (§3.4, review r1 #3): every browser write and delete of one (person, project) runs in
# its own Durable Object (src/webhost-do.ts), one at a time, its in-flight change journalled in the object's storage.
[[durable_objects.bindings]]
name = "WEB_HOST"
class_name = "WebHostObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebHostObject"]

# The folder's push hub (PEP 0005 §3): one hibernating-WebSocket Durable Object per (person, project) that says "host H
# is now at seq N" to the folder's machines and pages (src/hub.ts). A hint only: clients still poll, slower.
[[durable_objects.bindings]]
name = "HUB"
class_name = "FolderHub"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FolderHub"]

[vars]
ENVIRONMENT = "production"
# This Worker's own host: the CLI's default server and the account pages (placeholder until the first deploy)
PUBLIC_URL = "https://folder-sync-accounts.zach-yamaoka.workers.dev"
# The sync store: folder-sync's bucket, one prefix per person (users/<account id>/). Placeholder: Zach sets the real
# account id at deploy.
R2_ACCOUNT_ID = "c2747ee6a8842e150e38acc3d044adde"
SYNC_BUCKET = "folder-sync"
# ROOT_PREFIX (unset here: keys are users/<id>/) is each other app's own root in the bucket, apps/<app>/; see [env.*] below
# Empty: https://<R2_ACCOUNT_ID>.r2.cloudflarestorage.com (a local stand-in in the proof)
R2_ENDPOINT = ""
# How long a machine's storage keys live: a revoked (or over-quota) machine stops within this (and refreshes a third
# before it ends). 5 minutes: it also bounds how far past its quota one person can go (src/quota.ts).
SYNC_CREDENTIAL_TTL_S = "300"
# Each person's storage ceiling under users/<id>/, _trash/ included (PEP 0003 §3.7): 1 GiB and 100 000 files. Over it,
# read-only storage keys (deletes go through the Worker) and no web writes. Measured by listing the root at most every QUOTA_RECHECK_S seconds, which
# takes one subrequest per 1000 files: QUOTA_OBJECTS above ~45 000 needs the Workers Paid plan's subrequest limit.
QUOTA_BYTES = "1073741824"
QUOTA_OBJECTS = "100000"
QUOTA_RECHECK_S = "300"
# A measurement older than this (s) admits no new writes when no newer one can be taken: read-only keys, web writes 503
QUOTA_MAX_AGE_S = "3600"
# Per-person ceilings over the two above (src/quota.ts quotaOf), by user id: the operator grants more one person at a time.
# ysoJLOgtD3znbT8X0noLOHEZIyfiyeOG is Zach (zach.yamaoka@gmail.com): 10 GiB (Zach, 2026-10-29: "please increase my limit").
QUOTA_BY_OWNER = '{"ysoJLOgtD3znbT8X0noLOHEZIyfiyeOG": {"bytes": 10737418240}}'
# Who sign-in codes come from (an address on a domain verified in Resend); empty: no email codes in production.
# Codes go out once this and the secret RESEND_API_KEY are both set (src/email.ts, PEP 0003 §3.3).
EMAIL_FROM = "Robot Parts <signin@robotparts.dev>"
# Secrets, set once by the operator (never in this file): BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# RESEND_API_KEY, R2_PARENT_ACCESS_KEY_ID, R2_PARENT_SECRET_ACCESS_KEY, and SIGN_UP_EMAILS (who may create an account, comma-separated;
# unset means nobody new, "*" anyone; it holds real emails, so it is a secret). Until they are set, sign-in answers 503
# and nothing is served.

# ------------------------------------------------------------------------------------------------ one block per app
# WHY a block per app and not one shared deployment (Zach, 2026-11-04: "Robotparts and veibtracks should be split and as
# well as anything going forward"): each app gets its own D1 (its own users, sessions, folder rows), its own BETTER_AUTH_SECRET,
# its own Durable Object namespaces (a Worker's classes are namespaced by the Worker's name) and its own root in the one bucket
# (ROOT_PREFIX), so one app's ids, outage or sign-up list never touch another's. wrangler inherits only some keys into an
# [env.*] block: the bindings, vars and migrations below are all repeated on purpose, or the block would deploy without them.
# The R2 parent key, Google client and the rest are secrets, set per env: `wrangler secret put <NAME> --env <app>`.

[env.robotparts]
name = "folder-sync-accounts-robotparts"
# the Worker's own host (the CLI's default server and the account pages); robotparts.dev/fs reaches it through the service binding
vars = { ENVIRONMENT = "production", PUBLIC_URL = "https://folder-sync-accounts-robotparts.zach-yamaoka.workers.dev", R2_ACCOUNT_ID = "c2747ee6a8842e150e38acc3d044adde", SYNC_BUCKET = "folder-sync", R2_ENDPOINT = "", SYNC_CREDENTIAL_TTL_S = "300", QUOTA_BYTES = "1073741824", QUOTA_OBJECTS = "100000", QUOTA_RECHECK_S = "300", QUOTA_MAX_AGE_S = "3600", QUOTA_BY_OWNER = "", EMAIL_FROM = "Robot Parts <signin@robotparts.dev>", ROOT_PREFIX = "apps/robotparts/" }

[env.robotparts.assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true

# Its own database: wrangler d1 create folder-sync-accounts-robotparts, then its id here
[[env.robotparts.d1_databases]]
binding = "DB"
database_name = "folder-sync-accounts-robotparts"
database_id = "3f9eb26f-0164-4089-b662-6669f89b5524"
migrations_dir = "migrations"

# The installers bucket is shared and read-only here (served at /fs/download); CI uploads to it once, whichever app serves it
[[env.robotparts.r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "folder-sync-downloads"

[[env.robotparts.durable_objects.bindings]]
name = "WEB_HOST"
class_name = "WebHostObject"

[[env.robotparts.durable_objects.bindings]]
name = "HUB"
class_name = "FolderHub"

[[env.robotparts.migrations]]
tag = "v1"
new_sqlite_classes = ["WebHostObject"]

[[env.robotparts.migrations]]
tag = "v2"
new_sqlite_classes = ["FolderHub"]
