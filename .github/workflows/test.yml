# The tests, on the three OSes folder-sync ships on (Zach, 2026-10-29: test every place the app touches the OS, on every
# OS; the UI once). `go vet` and `go test ./...` (the e2e included) run on Linux, macOS and Windows on every push and pull
# request; two more jobs carry a bucket written on Linux to Windows and macOS (e2e/crossos_test.go), because hosted
# runners cannot reach each other's 127.0.0.1.
#
# Each job's summary says how many e2e tests ran and how many skipped (scripts/testsummary), because a skipped e2e looks
# green and tests nothing. FOLDER_SYNC_E2E_REQUIRE=1 turns a skip for a missing tool (rclone, node, python's jsonschema)
# into a failure (internal/testtools).
# One repo, three named parts (PARTS.md), each its own red/green line so churn in one shows up as its own check:
#   core               the `test (...)` matrix and the cross-OS pair below, plus `core, no server` (seam 1)
#   server-cloudflare  `server-cloudflare` (the accounts Worker; its step "seam 2" is the identity adapter check)
#   ui                 `ui` (the sync element, in Chromium)
#   desktop            `desktop` (desktop-smoke.yml, called from here on every push: the installers built and installed on
#                      Linux, macOS and Windows) and desktop-release.yml (the release)
#   gates              `gates (linux)`: scripts/gates runs the proof of each gate G1..G12 (docs/GATES.md) and uploads gates.json
# The three OS legs (docs/PLATFORMS.md): each `test (...)` job ends by writing gates-leg-<os> (its own G4 verdict) and g11-timer-<os>
# (scripts/first-sync-timer: a clean HOME, install, sign in, add a folder, first file synced, 120 s or fewer). `gates (linux)`
# downloads all three, and G4 passes only when linux, macos and windows each passed.
# `test (...)` keeps its name: a required check may be pinned to it.
# WHY every action pinned to a full commit SHA, with its release in the comment, at least two weeks old (Zach's rule for new
# dependencies, 2026-10-28). desktop-release.yml pins the same releases by tag.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FOLDER_SYNC_E2E_REQUIRE: "1"
  # Cases a run found failing, skipped under their id until fixed (what is wrong: knownBugs in e2e/crossos_test.go). The
  # summary lists them as quarantined. Empty since gate G9 fixed junk-files and unicode-normalization (2026-11-04).
  FOLDER_SYNC_QUARANTINE: ""

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # goos: Go's spelling of the OS, the one first-sync-<goos>.json is named by
          - name: linux
            # WHY -latest, not 22.04: the tests run the current Ubuntu; only a release needs the oldest glibc (desktop-release.yml)
            runner: ubuntu-latest
            goos: linux
          - name: macos
            # WHY macos-latest: Apple silicon (arm64), the Mac a person has now; the first-sync file records the arch it ran on
            runner: macos-latest
            goos: darwin
          - name: windows
            runner: windows-latest
            goos: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        # WHY bash everywhere: scripts/dev-tools is bash; Git Bash is what windows-latest ships
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # e2e needs node >= 22.18 (it runs the Worker reader's TypeScript directly)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: jsonschema (the manifest-schema check)
        run: python -m pip install jsonschema

      - name: The pinned rclone (scripts/dev-tools)
        run: scripts/dev-tools

      - name: go vet
        run: go vet ./...

      # the frozen contract's schemas against the shared fixtures; no dependency, so Linux once is enough
      - name: schema fixtures
        if: runner.os == 'Linux'
        run: node --test schema/fixtures.test.mjs

      - name: go test (e2e included)
        run: |
          set +e
          go test -count=1 -json ./... > "$RUNNER_TEMP/test.json"
          status=$?
          go run ./scripts/testsummary -os "$RUNNER_OS" < "$RUNNER_TEMP/test.json" | tee -a "$GITHUB_STEP_SUMMARY"
          go run ./scripts/testsummary -failures < "$RUNNER_TEMP/test.json"
          exit $status

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-json-${{ matrix.name }}
          path: ${{ runner.temp }}/test.json
          retention-days: 7

      # gate G11 (docs/GATES.md): how long a fresh HOME takes from `init` to its first sync on this OS; scripts/gates collects it
      - name: G11, time to first sync on this OS
        run: |
          mkdir -p "$RUNNER_TEMP/g11"
          FOLDER_SYNC_G11_OUT="$RUNNER_TEMP/g11/g11-${{ matrix.name }}.json" go test -count=1 -run '^TestGateFirstSyncWithinTwoMinutes$' ./e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g11-${{ matrix.name }}
          path: ${{ runner.temp }}/g11
          if-no-files-found: ignore
          retention-days: 7

      # gate G11, the whole walk on a clean HOME: install (the README's go build), sign in against the local stack (wrangler dev,
      # the R2 stand-in), add a folder, first file read back from the Worker; fails over 120 s. The stack needs the Worker's
      # dependencies, with install scripts (workerd's postinstall), so this is not the --ignore-scripts install the other jobs use.
      # continue-on-error: a slow first sync is G11's red (scripts/gates reads the file), not the Go suite's.
      - name: npm ci (accounts, for the local stack)
        run: npm ci --no-audit --no-fund
        working-directory: accounts

      - name: G11, first sync from a clean HOME (scripts/first-sync-timer)
        id: first_sync
        continue-on-error: true
        run: node scripts/first-sync-timer --out "$RUNNER_TEMP/g11/first-sync-${{ matrix.goos }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g11-timer-${{ matrix.name }}
          path: ${{ runner.temp }}/g11/first-sync-${{ matrix.goos }}.json
          if-no-files-found: ignore
          retention-days: 7

      # gate G4, this OS's leg: scripts/gates writes gates-<os>.json holding G4 (this job's own result) and G11 (the timer's file).
      # `if: always()` and job.status make it the verdict of every step above, including a red go test.
      - name: G4, this OS's verdict (gates-${{ matrix.name }}.json)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/leg"
          node scripts/gates --os-leg "${{ matrix.name }}" --job-status "$JOB_STATUS" --no-gh --collect "$RUNNER_TEMP/g11" --out "$RUNNER_TEMP/leg/gates-${{ matrix.name }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gates-leg-${{ matrix.name }}
          path: ${{ runner.temp }}/leg/gates-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  # Part desktop: the installers built and silently installed on Linux, macOS and Windows (desktop-smoke.yml, also runnable alone with
  # workflow_dispatch). WHY called from here: G4 needs this very run's result, and a plain pull_request trigger there ran it only when
  # app/** changed, so on most commits the gate would read an older run. It publishes nothing. To run it only on app changes, put an
  # `if:` on this job that compares `git diff --name-only` in a first job; the cost is the Tauri build, about 20 minutes per OS.
  desktop:
    name: desktop
    uses: ./.github/workflows/desktop-smoke.yml

  # Part core, seam 1 (PARTS.md): the core works with no server at all. scripts/check-core-alone copies the checkout WITHOUT
  # accounts/, demo/ and app/ and runs the core there: the e2e on bucket-key login against the local R2 stand-in, the Go
  # tests, the schema fixtures. Anything in the core that imports, reads or starts the server part fails here, because the
  # directory is not there. No `npm ci` in this job on purpose: there is no Worker to start.
  core-alone:
    name: core, no server (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: jsonschema (the manifest-schema check)
        run: python -m pip install jsonschema

      - name: The pinned rclone (scripts/dev-tools)
        run: scripts/dev-tools

      - name: The core without the server part
        run: scripts/check-core-alone

  # Part server-cloudflare: the accounts Worker's own tests (Better Auth over node:sqlite, in-memory S3; no wrangler, no
  # network). Seam 2 runs first and alone, so "reaches identity around the port" is its own failure.
  server-cloudflare:
    name: server-cloudflare (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: accounts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the Worker's tests run its TypeScript directly (node >= 22.18)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # WHY --ignore-scripts: wrangler's workerd postinstall fetches nothing the tests use
      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: seam 2, identity only through deps.person (the adapter is the only file that imports better-auth)
        run: node --test test/identity-seam.test.ts

      - name: npm test
        run: npm test

  # Part ui: <folder-sync-status> in Chromium over the shared fixtures in testdata/view-api/ (a stub server, no Worker).
  ui:
    name: ui (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Chromium (the version @playwright/test pins)
        run: npx playwright install --with-deps chromium

      - name: npm test
        run: npm test

  # The Linux half of the pair: write the awkward tree with a real push, assert what landed and what was refused, and
  # save the bucket (a tar, because a Windows folder cannot hold CON.txt or a:b).
  pair-write:
    name: cross-OS pair, write (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The pinned rclone (scripts/dev-tools)
        run: scripts/dev-tools

      - name: Write the tree
        env:
          FOLDER_SYNC_XOS_OUT: ${{ runner.temp }}/xos
        run: go test -count=1 -v ./e2e -run '^TestCrossOSWrite$'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xos-bucket
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/xos

  # The other half: pull that bucket onto Windows and macOS, and check each name landed or was refused with a reason.
  pair-pull:
    name: cross-OS pair, pull (${{ matrix.name }})
    needs: pair-write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The pinned rclone (scripts/dev-tools)
        run: scripts/dev-tools

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xos-bucket
          path: ${{ runner.temp }}/xos

      - name: Pull the tree
        env:
          FOLDER_SYNC_XOS_IN: ${{ runner.temp }}/xos
          FOLDER_SYNC_XOS_REPORT: ${{ runner.temp }}/xos-report.md
        run: |
          set +e
          go test -count=1 -json ./e2e -run '^TestCrossOSPull$' > "$RUNNER_TEMP/pull.json"
          status=$?
          go run ./scripts/testsummary -os "$RUNNER_OS (pair)" < "$RUNNER_TEMP/pull.json" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -f "$FOLDER_SYNC_XOS_REPORT" ] && cat "$FOLDER_SYNC_XOS_REPORT" >> "$GITHUB_STEP_SUMMARY"
          go run ./scripts/testsummary -failures < "$RUNNER_TEMP/pull.json"
          exit $status

  # Gate proofs (docs/GATES.md): scripts/gates in its CI profile (the soak runs 90 s), then gates.json as an artifact and a table
  # in the job summary. It needs every job above so G4 reads this very run, and runs when one of them failed (that is G4's red).
  # A gate that is not_built or skipped does not fail the job: it says what is missing. A failed gate does.
  gates:
    name: gates (linux)
    needs: [test, desktop, core-alone, server-cloudflare, ui, pair-pull]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: jsonschema (the manifest-schema check)
        run: python -m pip install jsonschema

      - name: The pinned rclone (scripts/dev-tools)
        run: scripts/dev-tools

      # the Worker's tests (G3, G10) and the web journey (G5) run here; the journey starts wrangler dev, so install scripts run
      - name: npm ci (accounts)
        run: npm ci --no-audit --no-fund
        working-directory: accounts

      - name: npm ci (ui)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ui

      - name: Chromium (the version @playwright/test pins)
        run: npx playwright install --with-deps chromium
        working-directory: ui

      # the desktop journey (G5) drives app/ui in Chromium; the Chromium above is the same Playwright version
      - name: npm ci (app, for the desktop journey)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: app

      - name: scripts/gates' own tests
        run: node --test scripts/gates.test.mjs scripts/first-sync-timer.test.mjs app/test/shell.test.mjs

      # g11-<os> (the Go test's number) and g11-timer-<os> (first-sync-<goos>.json) land in one folder: scripts/gates --collect
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: g11-*
          merge-multiple: true
          path: ${{ runner.temp }}/g11
        continue-on-error: true

      # the three OS legs, each its own folder: scripts/gates --os-results finds gates-<os>.json in them
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gates-leg-*
          path: ${{ runner.temp }}/legs
        continue-on-error: true

      # WHY the needs JSON through an environment variable: the shell never sees workflow text
      - name: Run the gates
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          scripts/gates --profile ci --with-web --needs "$RUNNER_TEMP/needs.json" --collect "$RUNNER_TEMP/g11" --os-results "$RUNNER_TEMP/legs"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: gates-json
          path: reports/status
          retention-days: 30
